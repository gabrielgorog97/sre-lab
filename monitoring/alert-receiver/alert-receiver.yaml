apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-receiver
    spec:
      containers:
        - name: receiver
          image: mendhak/http-https-echo:42
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: LOG_IGNORE_PATH
              value: /healthz
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alert-receiver
spec:
  selector:
    app.kubernetes.io/name: alert-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
