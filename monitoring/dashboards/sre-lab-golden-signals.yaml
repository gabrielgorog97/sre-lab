apiVersion: v1
kind: ConfigMap
metadata:
  name: sre-lab-golden-signals
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  sre-lab-golden-signals.json: |
    {
      "uid": "sre-lab-golden-signals",
      "title": "sre-lab / Golden signals",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Data source"
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Environment",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": { "query": "label_values(http_requests_total{namespace=~\"sre-lab-.*\"}, namespace)", "refId": "ns" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 11,
          "type": "table",
          "title": "Active alerts",
          "description": "Pending: the rule is broken, Prometheus waits to be sure. Firing: the alert was sent to Alertmanager. Empty means all good.",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "expr": "ALERTS{namespace=\"$namespace\"}",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "names": ["alertname", "alertstate", "severity"] } } }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "alertstate" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "firing": { "color": "red", "text": "Firing" },
                          "pending": { "color": "orange", "text": "Pending" }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
        },
        {
          "id": 1,
          "type": "stat",
          "title": "Pods up",
          "gridPos": { "x": 0, "y": 5, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "refId": "A", "expr": "sum(up{namespace=\"$namespace\", service=\"$namespace\"})" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error rate (5xx)",
          "gridPos": { "x": 6, "y": 5, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(sum(rate(http_requests_total{namespace=\"$namespace\", status=~\"5..\"}[2m])) or vector(0)) / sum(rate(http_requests_total{namespace=\"$namespace\"}[2m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency",
          "gridPos": { "x": 12, "y": 5, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", path!=\"/metrics\"}[5m])))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Requests per second",
          "gridPos": { "x": 18, "y": 5, "w": 6, "h": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            { "refId": "A", "expr": "sum(rate(http_requests_total{namespace=\"$namespace\"}[2m]))" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Traffic by status code",
          "gridPos": { "x": 0, "y": 10, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"$namespace\"}[2m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "gridPos": { "x": 12, "y": 10, "w": 12, "h": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", path!=\"/metrics\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", path!=\"/metrics\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", path!=\"/metrics\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Requests by path",
          "gridPos": { "x": 0, "y": 19, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (path) (rate(http_requests_total{namespace=\"$namespace\"}[2m]))",
              "legendFormat": "{{path}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory per pod (saturation)",
          "gridPos": { "x": 12, "y": 19, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"$namespace\", container=\"app\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Log lines with 5xx (Loki)",
          "gridPos": { "x": 0, "y": 27, "w": 24, "h": 6 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (count_over_time({namespace=\"$namespace\", container=\"app\"} |~ \"\\\" 5[0-9]{2} \" [1m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Application logs (Loki)",
          "gridPos": { "x": 0, "y": 33, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            { "refId": "A", "expr": "{namespace=\"$namespace\", container=\"app\"}" }
          ]
        }
      ]
    }
