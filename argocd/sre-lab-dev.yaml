apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-lab-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gabrielgorog97/sre-lab.git
    targetRevision: main
    path: charts/sre-lab
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sre-lab-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
