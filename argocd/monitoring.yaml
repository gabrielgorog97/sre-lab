apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.9.0
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 2d
          service:
            type: LoadBalancer
        grafana:
          admin:
            existingSecret: grafana-admin
          grafana.ini:
            server:
              root_url: https://grafana.gabrielgorog.ro
            auth.anonymous:
              enabled: true
              org_role: Viewer
            dashboards:
              default_home_dashboard_path: /tmp/dashboards/sre-lab-golden-signals.json
          service:
            type: LoadBalancer
            port: 3000
          sidecar:
            dashboards:
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              url: http://loki.monitoring.svc:3100
              access: proxy
        alertmanager:
          service:
            type: LoadBalancer
          config:
            route:
              receiver: "null"
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
                - receiver: oncall-critical
                  matchers:
                    - severity = "critical"
                  repeat_interval: 1h
                - receiver: oncall-warning
                  matchers:
                    - severity = "warning"
            receivers:
              - name: "null"
              - name: oncall-critical
                webhook_configs:
                  - url: http://alert-receiver.monitoring.svc:8080/critical
                    send_resolved: true
              - name: oncall-warning
                webhook_configs:
                  - url: http://alert-receiver.monitoring.svc:8080/warning
                    send_resolved: true
        prometheus-node-exporter:
          hostRootFsMount:
            enabled: false
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
