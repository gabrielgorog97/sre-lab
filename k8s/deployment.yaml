apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-lab
  namespace: sre-lab
  labels:
    app: sre-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sre-lab
  template:
    metadata:
      labels:
        app: sre-lab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: ghcr.io/gabrielgorog97/sre-lab:sha-f63dd8f
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
