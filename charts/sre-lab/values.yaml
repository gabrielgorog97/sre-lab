replicaCount: 1

image:
  repository: ghcr.io/gabrielgorog97/sre-lab
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

containerPort: 8000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

probes:
  path: /health
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
